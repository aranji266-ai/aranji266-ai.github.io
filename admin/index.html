<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <title>DAVIS // DATA EDITOR</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main class="admin">
  <header><div><small>DAVIS PRIVATE NODE</small><h1>DATA EDITOR</h1></div><a href="/">PUBLIC SITE →</a></header>
  <section class="login" id="login"><p class="eyebrow">AUTHORIZED ACCESS ONLY</p><h2>后台登录</h2><p>登录后可在手机上修改站名、人物图片、作品资料，并上传多页扫描档案。</p><div><input id="key" type="password" autocomplete="current-password" placeholder="ADMIN KEY"><button id="unlock" type="button">接入</button></div><p id="loginMsg" role="status"></p></section>
  <section id="editor" hidden>
    <p class="notice">这里保存的内容会立即同步到公开网页，无需重新部署。</p>
    <h2>页面排版</h2>
    <div class="form">
      <label>首页标题<textarea id="headline" rows="3"></textarea></label>
      <label>首页说明<textarea id="intro" rows="3"></textarea></label>
      <label>作品排版<select id="worksMode"><option value="rail">横向档案轨道</option><option value="grid">网格档案墙</option></select></label>
      <label>强调色<select id="accent"><option value="blue">蓝色</option><option value="violet">紫色</option></select></label>
      <label>首页照片左右位置 <output id="heroXOut"></output><input id="heroX" type="range" min="0" max="100"></label>
      <label>首页照片上下位置 <output id="heroYOut"></output><input id="heroY" type="range" min="0" max="100"></label>
    </div>
    <h2>人物档案</h2><div class="subjectEditor" id="subjects"></div>
    <h2>作品档案</h2><div class="workEditor" id="works"></div>
    <div class="addRow"><button class="add" id="add" type="button">＋ 普通作品</button><button class="add historyAdd" id="addHistory" type="button">＋ 历史扫描档案</button></div>
  </section>
</main>
<footer id="savebar" hidden><span id="msg" role="status">READY</span><button id="save" type="button">保存并发布</button></footer>
<script src="/data.js?v=20260814-1"></script><script src="/admin/admin.js?v=20260814-1"></script>
</body></html>
